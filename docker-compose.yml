# Local environment for the auction platform (owner: Erona, task A-04).
#   docker compose up -d        start the infrastructure (waits for health checks)
#   docker compose ps           every container should show "healthy"
#   docker compose down -v      stop and delete data; the next `up` re-creates and re-seeds the DBs
# Values come from .env (copy .env.example), and the JWT keys from `npm run gen-keys`. The API is
# reached only through the gateway: https://localhost:8443/api/v1 (gateway/README.md). The other
# services are added here as they are built; Prometheus comes with Anesa's monitoring profile.

name: auction-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by database/init-databases.sh to name each service's database.
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUCTION_DB_NAME: ${AUCTION_DB_NAME:-auction_db}
      BIDDING_DB_NAME: ${BIDDING_DB_NAME:-bidding_db}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      - ./database:/database:ro
    ports:
      # Bound to localhost only, so the database is never reachable from the network.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672'
      # Management UI: http://localhost:15672
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [backend]
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-auction-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auction-platform}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env}
      EVENTS_EXCHANGE: ${EVENTS_EXCHANGE:-auction.events}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-300}
    volumes:
      # auth-service is the only service that gets the private key.
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + process.env.AUTH_SERVICE_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  auction-service:
    build:
      context: .
      dockerfile: backend/services/auction-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUCTION_SERVICE_PORT: ${AUCTION_SERVICE_PORT:-3002}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUCTION_DB_NAME: ${AUCTION_DB_NAME:-auction_db}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-auction-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auction-platform}
      CURRENCY: ${CURRENCY:-EUR}
      BIDDING_SERVICE_URL: ${BIDDING_SERVICE_URL:-http://bidding-service:3003}
      BIDDING_CANCEL_TIMEOUT_MS: ${BIDDING_CANCEL_TIMEOUT_MS:-2000}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env}
      EVENTS_EXCHANGE: ${EVENTS_EXCHANGE:-auction.events}
    volumes:
      # Only the public key: this service can verify tokens but never create them.
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + process.env.AUCTION_SERVICE_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  bidding-service:
    build:
      context: .
      dockerfile: backend/services/bidding-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BIDDING_SERVICE_PORT: ${BIDDING_SERVICE_PORT:-3003}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BIDDING_DB_NAME: ${BIDDING_DB_NAME:-bidding_db}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-auction-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auction-platform}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env}
      EVENTS_EXCHANGE: ${EVENTS_EXCHANGE:-auction.events}
      SNIPE_WINDOW_SECONDS: ${SNIPE_WINDOW_SECONDS:-30}
      SNIPE_EXTENSION_SECONDS: ${SNIPE_EXTENSION_SECONDS:-30}
      MAX_EXTENSIONS: ${MAX_EXTENSIONS:-10}
      CLOSING_INTERVAL_MS: ${CLOSING_INTERVAL_MS:-1000}
      CLOSING_BATCH_SIZE: ${CLOSING_BATCH_SIZE:-50}
    volumes:
      # Only the public key: this service can verify tokens but never create them.
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + process.env.BIDDING_SERVICE_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-3004}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-auction-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auction-platform}
      CURRENCY: ${CURRENCY:-EUR}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env}
      EVENTS_EXCHANGE: ${EVENTS_EXCHANGE:-auction.events}
    volumes:
      # Only the public key: this service can verify tokens but never create them.
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + process.env.PAYMENT_SERVICE_PORT + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  gateway:
    build:
      context: gateway
    environment:
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-8443}
      GATEWAY_API_RATE: ${GATEWAY_API_RATE:-20r/s}
      GATEWAY_API_BURST: ${GATEWAY_API_BURST:-40}
      GATEWAY_AUTH_RATE: ${GATEWAY_AUTH_RATE:-10r/m}
      GATEWAY_AUTH_BURST: ${GATEWAY_AUTH_BURST:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      # The self-signed certificate is created here on first start (gitignored).
      - ./gateway/certs:/etc/nginx/certs
    ports:
      # The only way into the API. Bound to localhost, like everything else in this file.
      - '127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:80'
      - '127.0.0.1:${GATEWAY_HTTPS_PORT:-8443}:443'
    # No depends_on: service names are resolved per request, so the gateway starts even while a
    # service is missing and answers 503 for it.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

networks:
  # Internal network shared by infrastructure, services and the gateway. Only the gateway publishes
  # an API port to the host.
  backend:
    name: auction-backend

volumes:
  postgres-data:
  rabbitmq-data:
