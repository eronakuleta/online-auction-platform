# CORS headers (task A-23), included by every server block and named location in the gateway.
# Browsers only let a page read the answer if Access-Control-Allow-Origin names its origin.
# $cors_origin is empty for an origin that is not allowed, and nginx then leaves the header out,
# so the browser blocks the response. "always" adds them to error answers too (429, 503, ...),
# otherwise the frontend could not even read why a request failed.
# No Allow-Credentials: tokens travel in the Authorization header, never in cookies.
add_header Access-Control-Allow-Origin   $cors_origin always;
add_header Vary                          Origin always;
add_header Access-Control-Allow-Methods  "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers  "Authorization, Content-Type, Idempotency-Key, X-Request-Id" always;
add_header Access-Control-Expose-Headers "X-Request-Id, Location, Retry-After" always;
add_header Access-Control-Max-Age        600 always;
