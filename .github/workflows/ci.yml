# Continuous integration: every push and every PR to main must pass these checks before merging.
# The database job applies every schema and seed to a real Postgres 16. Docker image builds
# are added once services have Dockerfiles (after A-04).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time value only; the real gateway URL comes from .env at runtime.
      VITE_API_BASE_URL: https://localhost:8443/api/v1
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  database:
    name: Database schemas and seeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      # The same script Docker Compose runs on a fresh volume. RERUN_SEEDS=1 runs every seed a
      # second time to prove it is safe to rerun.
      - name: Apply every schema and seed to a fresh Postgres 16
        env:
          DATABASE_DIR: database
          POSTGRES_USER: postgres
          RERUN_SEEDS: '1'
        run: bash database/init-databases.sh
