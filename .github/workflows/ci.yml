# Continuous integration: every push and every PR to main must pass these checks before merging.
# Later tasks add a Postgres service container (integration tests) and Docker image builds.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time value only; the real gateway URL comes from .env at runtime.
      VITE_API_BASE_URL: https://localhost:8443/api/v1
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
