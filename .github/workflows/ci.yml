# Continuous integration: every push and every PR to main must pass these checks before merging.
# Tests and the database job use a real Postgres 16. Each service's Docker image is built too, and
# the gateway job starts the whole stack and tests it through the gateway.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Integration tests use a real Postgres, never mocked repositories.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # bidding-service's state cache tests (B-09) use a real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      # Build-time value only; the real gateway URL comes from .env at runtime.
      VITE_API_BASE_URL: https://localhost:8443/api/v1
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build the auth-service image
        run: docker build -f backend/services/auth-service/Dockerfile .

      - name: Build the auction-service image
        run: docker build -f backend/services/auction-service/Dockerfile .

      - name: Build the bidding-service image
        run: docker build -f backend/services/bidding-service/Dockerfile .

      - name: Build the payment-service image
        run: docker build -f backend/services/payment-service/Dockerfile .

      - name: Build the notification-service image
        run: docker build -f backend/services/notification-service/Dockerfile .

  database:
    name: Database schemas and seeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      # The same script Docker Compose runs on a fresh volume. RERUN_SEEDS=1 runs every seed a
      # second time to prove it is safe to rerun.
      - name: Apply every schema and seed to a fresh Postgres 16
        env:
          DATABASE_DIR: database
          POSTGRES_USER: postgres
          RERUN_SEEDS: '1'
        run: bash database/init-databases.sh

  gateway:
    name: Gateway smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # For the events and wallet tests, which use amqplib and pg.
      - name: Install dependencies
        run: npm ci

      # Test values only: .env.example and keys made for this run, never real secrets.
      - name: Prepare .env and JWT keys
        run: |
          cp .env.example .env
          node backend/shared/auth/scripts/gen-keys.mjs
          # gen-keys makes the private key readable by its owner only. On Linux the container runs
          # as another user (node), so it could not read it. This key exists only for this run.
          chmod 644 secrets/jwt_private.pem

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # NODE_EXTRA_CA_CERTS trusts the gateway's self-signed certificate, so TLS is verified.
      - name: Test through the gateway
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/e2e/gateway-smoke.mjs

      - name: Security test suite
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/security/security.e2e.mjs

      # Publishes an auction and listens on the real broker, then sends auction.closed and
      # payment.completed to auction-service's queue, as bidding and payment will (task A-13).
      - name: Auction events test
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/e2e/auction-events.e2e.mjs

      # Registers a user and follows user.registered into payment_db, deposits through the gateway,
      # and calls the internal funds check from inside the Docker network (task A-17).
      - name: Wallet test
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/e2e/wallet.e2e.mjs

      # Publishes auction.closed to the real exchange; payment-service settles and auction-service
      # ends SETTLED or PAYMENT_FAILED (task A-18).
      - name: Settlement test
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/e2e/settlement.e2e.mjs

      # The whole lifecycle with nothing faked: publish, bid with the funds check, the closing worker
      # ends the auctions about 45 s later, settlement, SETTLED and CLOSED_NO_SALE (task A-28).
      - name: Lifecycle test
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/e2e/lifecycle.e2e.mjs

      # Two bidding replicas: requests reach both, and a stream on one gets bids from the other (A-21).
      - name: Load balancing test
        env:
          NODE_EXTRA_CA_CERTS: gateway/certs/cert.pem
        run: node --test tests/e2e/load-balancing.e2e.mjs

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
